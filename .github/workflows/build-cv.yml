name: Build CV PDF

on:
  push:
    branches: [main]
  workflow_dispatch:   # also allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync talk/conference counts in summary
        run: python update_talk_stats.py

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            main.tex
            main_long.tex

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add main.tex main.pdf main_long.tex main_long.pdf
          git diff --cached --quiet || git commit -m "Auto-build CV PDF [$(date -u +%Y-%m-%d)]"
          git push
