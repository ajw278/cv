name: Update publications

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:   # also allows manual trigger from GitHub Actions tab

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Regenerate publication list
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
          SCIX_API_KEY: ${{ secrets.SCIX_API_KEY }}
        # Tries ADS first, automatically falls back to Sci-X if ADS is unreachable.
        # Writes the full list into main_long.tex and just the summary stats into main.tex.
        run: python generate_publications.py

      - name: Commit and push to GitHub if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add main.tex main_long.tex
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update publications [$(date -u +%Y-%m-%d)]"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Push to Overleaf
        if: always()
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          git remote add overleaf "https://git:${OVERLEAF_TOKEN}@git.overleaf.com/606ed33d11366a3553d36e26"
          git fetch overleaf main
          git merge overleaf/main -X ours --no-edit
          git push overleaf main
